services:
  vllm-openai:
    image: vllm/vllm-openai:latest
    ports:
      - "8888:8000"
    volumes:
      - "C:/Users/Ethan/Documents/Github/Run-Models-With-VLLM/Qwen3-0.6B/Qwen3-0.6B:/qwen3_0.6b"
    environment:
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASET_OFFLINE=1
    ipc: host
    command: [
      "--model=/qwen3_0.6b/",
      "--host=0.0.0.0", 
      "--port=8000",
      "--tensor-parallel-size=1",
      "--gpu-memory-utilization=0.8",
      "--max-model-len=5140",
      "--enable-auto-tool-choice",
      "--tool-call-parser=hermes"
    ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]