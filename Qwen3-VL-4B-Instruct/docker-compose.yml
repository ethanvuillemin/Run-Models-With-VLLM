services:
  vllm-server:
    build: .
    container_name: vllm-qwen3-vl
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=Qwen/Qwen3-VL-4B-Instruct
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    shm_size: '8gb'

volumes:
  huggingface_cache: